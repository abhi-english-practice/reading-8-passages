<script id="reading-data" type="application/json">[{"id":1,"title":"A School Charity Event","category":"Community & Charity","prompt":"What makes a school charity event successful?","english":"Last month, our teacher asked us to organise a school charity event. At first, we thought we had adequate time to prepare, but things soon became complicated. Our team leader, Sara, was rather fickle and kept changing her mind about the programme. Although she was talented, her decisions sometimes frustrated everyone. Fortunately, Peter was a versatile student who could handle different tasks, from designing posters to repairing equipment. Despite his abilities, he always showed great humility and never tried to impress others. In contrast, Tom preferred flamboyant clothes and enjoyed being the centre of attention. One afternoon, we had to work outside in the torrid heat. To make matters worse, a vicious dog suddenly appeared near the school gate. I absolutely loathe aggressive animals, so I quickly stepped back. On the day of the event, our biggest opponent was another experienced team. However, instead of feeling nervous, we remained calm and confident. After several stressful days, it was wonderful to enjoy a serene evening together, knowing that our hard work had finally paid off.","vietnamese":"Tháng trước, giáo viên yêu cầu chúng tôi tổ chức một sự kiện từ thiện ở trường. Ban đầu, chúng tôi nghĩ mình có đủ thời gian để chuẩn bị, nhưng mọi chuyện nhanh chóng trở nên phức tạp. Trưởng nhóm Sara khá thất thường và liên tục thay đổi ý định về chương trình. Mặc dù có tài năng, những quyết định của cô ấy đôi khi khiến mọi người bực bội. May mắn thay, Peter là một học sinh đa năng, có thể đảm nhận nhiều công việc khác nhau, từ thiết kế áp phích đến sửa chữa thiết bị. Dù có nhiều khả năng, cậu ấy luôn thể hiện sự khiêm tốn và không bao giờ cố gây ấn tượng với người khác. Trái lại, Tom thích những bộ quần áo nổi bật, phô trương và thích trở thành tâm điểm chú ý. Một buổi chiều, chúng tôi phải làm việc ngoài trời dưới cái nóng như thiêu đốt. Tệ hơn nữa, một con chó hung dữ bất ngờ xuất hiện gần cổng trường. Tôi thực sự rất ghét những con vật hung hăng, vì vậy tôi nhanh chóng lùi lại. Vào ngày diễn ra sự kiện, đối thủ lớn nhất của chúng tôi là một đội khác giàu kinh nghiệm. Tuy nhiên, thay vì lo lắng, chúng tôi vẫn giữ bình tĩnh và tự tin. Sau nhiều ngày căng thẳng, thật tuyệt khi được cùng nhau tận hưởng một buổi tối yên bình, biết rằng những nỗ lực của mình cuối cùng đã được đền đáp.","sentences":[{"en":"Last month, our teacher asked us to organise a school charity event.","vi":"Tháng trước, giáo viên yêu cầu chúng tôi tổ chức một sự kiện từ thiện ở trường.","audioRange":[0.172,4.405]},{"en":"At first, we thought we had adequate time to prepare, but things soon became complicated.","vi":"Ban đầu, chúng tôi nghĩ mình có đủ thời gian để chuẩn bị, nhưng mọi chuyện nhanh chóng trở nên phức tạp.","audioRange":[4.855,10.05]},{"en":"Our team leader, Sara, was rather fickle and kept changing her mind about the programme.","vi":"Trưởng nhóm Sara khá thất thường và liên tục thay đổi ý định về chương trình.","audioRange":[10.44,15.315]},{"en":"Although she was talented, her decisions sometimes frustrated everyone.","vi":"Mặc dù có tài năng, những quyết định của cô ấy đôi khi khiến mọi người bực bội.","audioRange":[15.856,20.198]},{"en":"Fortunately, Peter was a versatile student who could handle different tasks, from designing posters to repairing equipment.","vi":"May mắn thay, Peter là một học sinh đa năng, có thể đảm nhận nhiều công việc khác nhau, từ thiết kế áp phích đến sửa chữa thiết bị.","audioRange":[20.69,28.296]},{"en":"Despite his abilities, he always showed great humility and never tried to impress others.","vi":"Dù có nhiều khả năng, cậu ấy luôn thể hiện sự khiêm tốn và không bao giờ cố gây ấn tượng với người khác.","audioRange":[28.767,33.551]},{"en":"In contrast, Tom preferred flamboyant clothes and enjoyed being the centre of attention.","vi":"Trái lại, Tom thích những bộ quần áo nổi bật, phô trương và thích trở thành tâm điểm chú ý.","audioRange":[34.148,39.38]},{"en":"One afternoon, we had to work outside in the torrid heat.","vi":"Một buổi chiều, chúng tôi phải làm việc ngoài trời dưới cái nóng như thiêu đốt.","audioRange":[40.079,43.802]},{"en":"To make matters worse, a vicious dog suddenly appeared near the school gate.","vi":"Tệ hơn nữa, một con chó hung dữ bất ngờ xuất hiện gần cổng trường.","audioRange":[44.223,48.656]},{"en":"I absolutely loathe aggressive animals, so I quickly stepped back.","vi":"Tôi thực sự rất ghét những con vật hung hăng, vì vậy tôi nhanh chóng lùi lại.","audioRange":[48.944,52.96]},{"en":"On the day of the event, our biggest opponent was another experienced team.","vi":"Vào ngày diễn ra sự kiện, đối thủ lớn nhất của chúng tôi là một đội khác giàu kinh nghiệm.","audioRange":[53.661,57.517]},{"en":"However, instead of feeling nervous, we remained calm and confident.","vi":"Tuy nhiên, thay vì lo lắng, chúng tôi vẫn giữ bình tĩnh và tự tin.","audioRange":[57.984,62.199]},{"en":"After several stressful days, it was wonderful to enjoy a serene evening together, knowing that our hard work had finally paid off.","vi":"Sau nhiều ngày căng thẳng, thật tuyệt khi được cùng nhau tận hưởng một buổi tối yên bình, biết rằng những nỗ lực của mình cuối cùng đã được đền đáp.","audioRange":[62.741,70.455]}],"phrases":[{"phrase":"organise a school charity event","meaning":"tổ chức một sự kiện từ thiện ở trường","sentenceIndex":0},{"phrase":"adequate time to prepare","meaning":"đủ thời gian để chuẩn bị","sentenceIndex":1},{"phrase":"kept changing her mind","meaning":"liên tục thay đổi ý định","sentenceIndex":2},{"phrase":"a versatile student","meaning":"một học sinh đa năng","sentenceIndex":4},{"phrase":"showed great humility","meaning":"thể hiện sự khiêm tốn","sentenceIndex":5},{"phrase":"flamboyant clothes","meaning":"quần áo sặc sỡ, phô trương","sentenceIndex":6},{"phrase":"torrid heat","meaning":"cái nóng như thiêu đốt","sentenceIndex":7},{"phrase":"a vicious dog","meaning":"một con chó hung dữ","sentenceIndex":8},{"phrase":"remained calm and confident","meaning":"vẫn giữ bình tĩnh và tự tin","sentenceIndex":11},{"phrase":"hard work had finally paid off","meaning":"những nỗ lực cuối cùng đã được đền đáp","sentenceIndex":12}],"image":"heading-01.png","audio":"audio-01.mp3","paragraphEnds":[4,7,10,13]},{"id":2,"title":"A Cooking Competition for Charity","category":"Community & Charity","prompt":"How can a team stay positive and work together in a cooking competition?","english":"Last summer, our class decided to enter a cooking competition to raise money for charity. We believed we had adequate supplies, but the fickle weather made everything more difficult. By midday, the temperature had risen sharply, and we were struggling in the torrid heat. Luckily, Emma was a highly versatile cook who could adapt to unexpected situations. She prepared delicious dishes while the rest of us created flamboyant decorations to attract customers. Our strongest opponent was a team of experienced students who seemed determined to win. Unfortunately, one member of their team made vicious remarks about our food. I absolutely loathe unfair criticism, but Emma reminded us to remain calm and focus on our goal. To everyone's surprise, we won first prize. Instead of boasting about her success, Emma showed genuine humility and thanked the entire team. That evening, we enjoyed a serene moment in the school garden, feeling proud that our hard work had paid off.","vietnamese":"Mùa hè năm ngoái, lớp chúng tôi quyết định tham gia một cuộc thi nấu ăn để gây quỹ từ thiện. Chúng tôi tin rằng mình đã có đủ nguyên liệu và dụng cụ, nhưng thời tiết thất thường khiến mọi việc trở nên khó khăn hơn. Đến giữa trưa, nhiệt độ tăng mạnh và chúng tôi phải chật vật dưới cái nóng như thiêu đốt. May mắn thay, Emma là một đầu bếp cực kỳ đa năng, có thể thích nghi với những tình huống bất ngờ. Cô ấy chuẩn bị những món ăn ngon trong khi những người còn lại tạo ra các món đồ trang trí rực rỡ, bắt mắt để thu hút khách hàng. Đối thủ mạnh nhất của chúng tôi là một đội học sinh giàu kinh nghiệm, dường như quyết tâm giành chiến thắng. Thật không may, một thành viên trong đội của họ đã đưa ra những lời nhận xét ác ý về món ăn của chúng tôi. Tôi thực sự rất ghét những lời chỉ trích thiếu công bằng, nhưng Emma nhắc mọi người giữ bình tĩnh và tập trung vào mục tiêu. Trước sự ngạc nhiên của tất cả mọi người, chúng tôi đã giành giải nhất. Thay vì khoe khoang về thành công của mình, Emma thể hiện sự khiêm tốn chân thành và cảm ơn toàn đội. Tối hôm đó, chúng tôi tận hưởng một khoảnh khắc yên bình trong khu vườn của trường, cảm thấy tự hào vì những nỗ lực của mình cuối cùng đã được đền đáp.","sentences":[{"en":"Last summer, our class decided to enter a cooking competition to raise money for charity.","vi":"Mùa hè năm ngoái, lớp chúng tôi quyết định tham gia một cuộc thi nấu ăn để gây quỹ từ thiện.","audioRange":[0.18,5.286]},{"en":"We believed we had adequate supplies, but the fickle weather made everything more difficult.","vi":"Chúng tôi tin rằng mình đã có đủ nguyên liệu và dụng cụ, nhưng thời tiết thất thường khiến mọi việc trở nên khó khăn hơn.","audioRange":[5.827,11.547]},{"en":"By midday, the temperature had risen sharply, and we were struggling in the torrid heat.","vi":"Đến giữa trưa, nhiệt độ tăng mạnh và chúng tôi phải chật vật dưới cái nóng như thiêu đốt.","audioRange":[12.107,17.835]},{"en":"Luckily, Emma was a highly versatile cook who could adapt to unexpected situations.","vi":"May mắn thay, Emma là một đầu bếp cực kỳ đa năng, có thể thích nghi với những tình huống bất ngờ.","audioRange":[18.511,23.732]},{"en":"She prepared delicious dishes while the rest of us created flamboyant decorations to attract customers.","vi":"Cô ấy chuẩn bị những món ăn ngon trong khi những người còn lại tạo ra các món đồ trang trí rực rỡ, bắt mắt để thu hút khách hàng.","audioRange":[24.193,30.79]},{"en":"Our strongest opponent was a team of experienced students who seemed determined to win.","vi":"Đối thủ mạnh nhất của chúng tôi là một đội học sinh giàu kinh nghiệm, dường như quyết tâm giành chiến thắng.","audioRange":[31.437,36.858]},{"en":"Unfortunately, one member of their team made vicious remarks about our food.","vi":"Thật không may, một thành viên trong đội của họ đã đưa ra những lời nhận xét ác ý về món ăn của chúng tôi.","audioRange":[37.492,42.235]},{"en":"I absolutely loathe unfair criticism, but Emma reminded us to remain calm and focus on our goal.","vi":"Tôi thực sự rất ghét những lời chỉ trích thiếu công bằng, nhưng Emma nhắc mọi người giữ bình tĩnh và tập trung vào mục tiêu.","audioRange":[42.727,49.688]},{"en":"To everyone's surprise, we won first prize.","vi":"Trước sự ngạc nhiên của tất cả mọi người, chúng tôi đã giành giải nhất.","audioRange":[50.821,53.902]},{"en":"Instead of boasting about her success, Emma showed genuine humility and thanked the entire team.","vi":"Thay vì khoe khoang về thành công của mình, Emma thể hiện sự khiêm tốn chân thành và cảm ơn toàn đội.","audioRange":[54.59,60.575]},{"en":"That evening, we enjoyed a serene moment in the school garden, feeling proud that our hard work had paid off.","vi":"Tối hôm đó, chúng tôi tận hưởng một khoảnh khắc yên bình trong khu vườn của trường, cảm thấy tự hào vì những nỗ lực của mình cuối cùng đã được đền đáp.","audioRange":[61.332,67.739]}],"phrases":[{"phrase":"enter a cooking competition","meaning":"tham gia một cuộc thi nấu ăn","sentenceIndex":0},{"phrase":"adequate supplies","meaning":"nguồn nguyên liệu và dụng cụ đầy đủ","sentenceIndex":1},{"phrase":"fickle weather","meaning":"thời tiết thất thường","sentenceIndex":1},{"phrase":"torrid heat","meaning":"cái nóng như thiêu đốt","sentenceIndex":2},{"phrase":"a highly versatile cook","meaning":"một đầu bếp rất đa năng","sentenceIndex":3},{"phrase":"adapt to unexpected situations","meaning":"thích nghi với những tình huống bất ngờ","sentenceIndex":3},{"phrase":"flamboyant decorations","meaning":"đồ trang trí sặc sỡ, bắt mắt","sentenceIndex":4},{"phrase":"vicious remarks","meaning":"những lời nhận xét ác ý","sentenceIndex":6},{"phrase":"remain calm","meaning":"giữ bình tĩnh","sentenceIndex":7},{"phrase":"focus on our goal","meaning":"tập trung vào mục tiêu của chúng tôi","sentenceIndex":7},{"phrase":"genuine humility","meaning":"sự khiêm tốn chân thành","sentenceIndex":9},{"phrase":"hard work had paid off","meaning":"những nỗ lực đã được đền đáp","sentenceIndex":10}],"image":"heading-02.png","audio":"audio-02.mp3","paragraphEnds":[3,8,11]},{"id":3,"title":"An Outdoor Adventure Challenge","category":"Challenges & Experiences","prompt":"What can an outdoor challenge teach us about teamwork and perseverance?","english":"Last weekend, our school organised an outdoor adventure challenge in a nearby forest. We had adequate food and water for the trip, but the fickle weather made it difficult to stick to our plan. The morning was cool and pleasant, but by noon, we were walking under the torrid sun. Fortunately, our team leader was highly versatile and knew how to deal with unexpected problems. While some students wore flamboyant outfits to stand out from the crowd, she chose simple, comfortable clothes. During the competition, we encountered a vicious dog near an abandoned house. I absolutely loathe being chased by animals, so I immediately kept my distance. Meanwhile, our main opponent was moving quickly towards the finish line. Instead of giving up, we worked together and managed to finish just a few minutes behind them. Although we did not win, our leader showed real humility by congratulating the winning team. Later, we found a serene spot beside a small lake, where we could relax and enjoy the peaceful surroundings. The experience taught us that teamwork and perseverance matter more than winning.","vietnamese":"Cuối tuần trước, trường chúng tôi tổ chức một cuộc thi thử thách phiêu lưu ngoài trời trong khu rừng gần đó. Chúng tôi mang theo đủ thức ăn và nước uống cho chuyến đi, nhưng thời tiết thất thường khiến việc tuân theo kế hoạch trở nên khó khăn. Buổi sáng trời mát mẻ, dễ chịu, nhưng đến trưa, chúng tôi phải đi bộ dưới cái nắng như thiêu đốt. May mắn thay, trưởng nhóm của chúng tôi rất đa năng và biết cách giải quyết những vấn đề bất ngờ. Trong khi một số học sinh mặc những bộ trang phục sặc sỡ, nổi bật để thu hút sự chú ý giữa đám đông, cô ấy lại chọn quần áo đơn giản và thoải mái. Trong cuộc thi, chúng tôi bắt gặp một con chó hung dữ gần ngôi nhà bỏ hoang. Tôi thực sự rất ghét bị động vật đuổi theo, nên lập tức giữ khoảng cách an toàn. Trong khi đó, đối thủ chính của chúng tôi đang nhanh chóng tiến về vạch đích. Thay vì bỏ cuộc, chúng tôi phối hợp cùng nhau và cố gắng hoàn thành cuộc thi chỉ sau họ vài phút. Mặc dù không giành chiến thắng, trưởng nhóm vẫn thể hiện sự khiêm tốn thực sự bằng cách chúc mừng đội chiến thắng. Sau đó, chúng tôi tìm thấy một nơi yên bình bên hồ nước nhỏ, nơi mọi người có thể thư giãn và tận hưởng khung cảnh thanh bình. Trải nghiệm này dạy chúng tôi rằng tinh thần đồng đội và sự kiên trì quan trọng hơn chiến thắng.","sentences":[{"en":"Last weekend, our school organised an outdoor adventure challenge in a nearby forest.","vi":"Cuối tuần trước, trường chúng tôi tổ chức một cuộc thi thử thách phiêu lưu ngoài trời trong khu rừng gần đó.","audioRange":[0.171,5.179]},{"en":"We had adequate food and water for the trip, but the fickle weather made it difficult to stick to our plan.","vi":"Chúng tôi mang theo đủ thức ăn và nước uống cho chuyến đi, nhưng thời tiết thất thường khiến việc tuân theo kế hoạch trở nên khó khăn.","audioRange":[5.691,11.502]},{"en":"The morning was cool and pleasant, but by noon, we were walking under the torrid sun.","vi":"Buổi sáng trời mát mẻ, dễ chịu, nhưng đến trưa, chúng tôi phải đi bộ dưới cái nắng như thiêu đốt.","audioRange":[12.122,17.099]},{"en":"Fortunately, our team leader was highly versatile and knew how to deal with unexpected problems.","vi":"May mắn thay, trưởng nhóm của chúng tôi rất đa năng và biết cách giải quyết những vấn đề bất ngờ.","audioRange":[17.859,22.881]},{"en":"While some students wore flamboyant outfits to stand out from the crowd, she chose simple, comfortable clothes.","vi":"Trong khi một số học sinh mặc những bộ trang phục sặc sỡ, nổi bật để thu hút sự chú ý giữa đám đông, cô ấy lại chọn quần áo đơn giản và thoải mái.","audioRange":[23.632,29.839]},{"en":"During the competition, we encountered a vicious dog near an abandoned house.","vi":"Trong cuộc thi, chúng tôi bắt gặp một con chó hung dữ gần ngôi nhà bỏ hoang.","audioRange":[30.677,34.87]},{"en":"I absolutely loathe being chased by animals, so I immediately kept my distance.","vi":"Tôi thực sự rất ghét bị động vật đuổi theo, nên lập tức giữ khoảng cách an toàn.","audioRange":[35.229,40.199]},{"en":"Meanwhile, our main opponent was moving quickly towards the finish line.","vi":"Trong khi đó, đối thủ chính của chúng tôi đang nhanh chóng tiến về vạch đích.","audioRange":[41.017,44.566]},{"en":"Instead of giving up, we worked together and managed to finish just a few minutes behind them.","vi":"Thay vì bỏ cuộc, chúng tôi phối hợp cùng nhau và cố gắng hoàn thành cuộc thi chỉ sau họ vài phút.","audioRange":[45.488,49.889]},{"en":"Although we did not win, our leader showed real humility by congratulating the winning team.","vi":"Mặc dù không giành chiến thắng, trưởng nhóm vẫn thể hiện sự khiêm tốn thực sự bằng cách chúc mừng đội chiến thắng.","audioRange":[50.545,55.282]},{"en":"Later, we found a serene spot beside a small lake, where we could relax and enjoy the peaceful surroundings.","vi":"Sau đó, chúng tôi tìm thấy một nơi yên bình bên hồ nước nhỏ, nơi mọi người có thể thư giãn và tận hưởng khung cảnh thanh bình.","audioRange":[56.163,62.443]},{"en":"The experience taught us that teamwork and perseverance matter more than winning.","vi":"Trải nghiệm này dạy chúng tôi rằng tinh thần đồng đội và sự kiên trì quan trọng hơn chiến thắng.","audioRange":[63.115,67.022]}],"phrases":[{"phrase":"outdoor adventure challenge","meaning":"thử thách phiêu lưu ngoài trời","sentenceIndex":0},{"phrase":"adequate food and water","meaning":"đủ thức ăn và nước uống","sentenceIndex":1},{"phrase":"fickle weather","meaning":"thời tiết thất thường","sentenceIndex":1},{"phrase":"stick to our plan","meaning":"tuân theo kế hoạch của chúng tôi","sentenceIndex":1},{"phrase":"torrid sun","meaning":"cái nắng như thiêu đốt","sentenceIndex":2},{"phrase":"deal with unexpected problems","meaning":"giải quyết những vấn đề bất ngờ","sentenceIndex":3},{"phrase":"flamboyant outfits","meaning":"những bộ trang phục sặc sỡ","sentenceIndex":4},{"phrase":"kept my distance","meaning":"giữ khoảng cách","sentenceIndex":6},{"phrase":"worked together","meaning":"phối hợp cùng nhau","sentenceIndex":8},{"phrase":"a serene spot","meaning":"một nơi yên bình","sentenceIndex":10},{"phrase":"teamwork and perseverance","meaning":"tinh thần đồng đội và sự kiên trì","sentenceIndex":11}],"image":"heading-03.png","audio":"audio-03.mp3","paragraphEnds":[5,9,12]},{"id":4,"title":"A National Youth Campaign","category":"Community & Leadership","prompt":"What qualities make a young leader effective in a community campaign?","english":"When Daniel was selected to lead a national youth campaign, he quickly realised that having adequate resources was not enough to guarantee success. The project aimed to raise awareness of environmental issues, but fickle public opinion made it difficult to maintain long-term support. Some volunteers were enthusiastic at first, only to lose interest when they faced unexpected setbacks. Daniel, however, proved to be a remarkably versatile leader, capable of adapting to changing circumstances without compromising his principles. While his main opponent resorted to flamboyant publicity stunts to attract media attention, Daniel preferred to let his actions speak for themselves. During a particularly torrid summer, his team worked tirelessly to restore a neglected public park, despite facing vicious personal attacks on social media. Although Daniel loathed dishonesty and manipulation, he refused to retaliate or stoop to their level. Instead, he demonstrated genuine humility by acknowledging his mistakes and giving credit to his team. Months later, as he sat beside a serene lake surrounded by newly planted trees, he realised that meaningful change rarely happens overnight. True leadership, he concluded, was not about being in the spotlight but about making a lasting difference.","vietnamese":"Khi Daniel được chọn dẫn dắt một chiến dịch thanh niên toàn quốc, anh nhanh chóng nhận ra rằng có đủ nguồn lực vẫn chưa đủ để bảo đảm thành công. Dự án nhằm nâng cao nhận thức về các vấn đề môi trường, nhưng dư luận thất thường khiến việc duy trì sự ủng hộ lâu dài trở nên khó khăn. Một số tình nguyện viên ban đầu rất nhiệt tình nhưng rồi mất dần hứng thú khi đối mặt với những trở ngại bất ngờ. Tuy nhiên, Daniel chứng tỏ mình là một nhà lãnh đạo đặc biệt đa năng, có khả năng thích nghi với hoàn cảnh thay đổi mà không đánh đổi các nguyên tắc của bản thân. Trong khi đối thủ chính của anh sử dụng những chiêu trò quảng bá phô trương để thu hút sự chú ý của truyền thông, Daniel lại muốn để hành động tự chứng minh giá trị. Trong một mùa hè nóng như thiêu đốt, nhóm của anh làm việc không mệt mỏi để khôi phục một công viên công cộng bị bỏ bê, bất chấp những lời công kích cá nhân ác ý trên mạng xã hội. Mặc dù Daniel căm ghét sự dối trá và thao túng, anh từ chối trả đũa hoặc hạ mình xuống ngang tầm với họ. Thay vào đó, anh thể hiện sự khiêm tốn chân thành bằng cách thừa nhận sai lầm và ghi nhận công lao của cả nhóm. Nhiều tháng sau, khi ngồi bên một hồ nước yên bình, xung quanh là những hàng cây mới trồng, anh nhận ra rằng những thay đổi có ý nghĩa hiếm khi diễn ra chỉ sau một đêm. Anh kết luận rằng khả năng lãnh đạo thực sự không nằm ở việc trở thành tâm điểm chú ý, mà ở việc tạo ra những thay đổi tích cực và bền vững.","sentences":[{"en":"When Daniel was selected to lead a national youth campaign, he quickly realised that having adequate resources was not enough to guarantee success.","vi":"Khi Daniel được chọn dẫn dắt một chiến dịch thanh niên toàn quốc, anh nhanh chóng nhận ra rằng có đủ nguồn lực vẫn chưa đủ để bảo đảm thành công.","audioRange":[0.158,9.711]},{"en":"The project aimed to raise awareness of environmental issues, but fickle public opinion made it difficult to maintain long-term support.","vi":"Dự án nhằm nâng cao nhận thức về các vấn đề môi trường, nhưng dư luận thất thường khiến việc duy trì sự ủng hộ lâu dài trở nên khó khăn.","audioRange":[10.582,18.058]},{"en":"Some volunteers were enthusiastic at first, only to lose interest when they faced unexpected setbacks.","vi":"Một số tình nguyện viên ban đầu rất nhiệt tình nhưng rồi mất dần hứng thú khi đối mặt với những trở ngại bất ngờ.","audioRange":[18.631,24.97]},{"en":"Daniel, however, proved to be a remarkably versatile leader, capable of adapting to changing circumstances without compromising his principles.","vi":"Tuy nhiên, Daniel chứng tỏ mình là một nhà lãnh đạo đặc biệt đa năng, có khả năng thích nghi với hoàn cảnh thay đổi mà không đánh đổi các nguyên tắc của bản thân.","audioRange":[25.876,34.604]},{"en":"While his main opponent resorted to flamboyant publicity stunts to attract media attention, Daniel preferred to let his actions speak for themselves.","vi":"Trong khi đối thủ chính của anh sử dụng những chiêu trò quảng bá phô trương để thu hút sự chú ý của truyền thông, Daniel lại muốn để hành động tự chứng minh giá trị.","audioRange":[35.229,43.489]},{"en":"During a particularly torrid summer, his team worked tirelessly to restore a neglected public park, despite facing vicious personal attacks on social media.","vi":"Trong một mùa hè nóng như thiêu đốt, nhóm của anh làm việc không mệt mỏi để khôi phục một công viên công cộng bị bỏ bê, bất chấp những lời công kích cá nhân ác ý trên mạng xã hội.","audioRange":[44.231,53.745]},{"en":"Although Daniel loathed dishonesty and manipulation, he refused to retaliate or stoop to their level.","vi":"Mặc dù Daniel căm ghét sự dối trá và thao túng, anh từ chối trả đũa hoặc hạ mình xuống ngang tầm với họ.","audioRange":[54.56,60.682]},{"en":"Instead, he demonstrated genuine humility by acknowledging his mistakes and giving credit to his team.","vi":"Thay vào đó, anh thể hiện sự khiêm tốn chân thành bằng cách thừa nhận sai lầm và ghi nhận công lao của cả nhóm.","audioRange":[61.073,66.987]},{"en":"Months later, as he sat beside a serene lake surrounded by newly planted trees, he realised that meaningful change rarely happens overnight.","vi":"Nhiều tháng sau, khi ngồi bên một hồ nước yên bình, xung quanh là những hàng cây mới trồng, anh nhận ra rằng những thay đổi có ý nghĩa hiếm khi diễn ra chỉ sau một đêm.","audioRange":[68.047,76.897]},{"en":"True leadership, he concluded, was not about being in the spotlight but about making a lasting difference.","vi":"Anh kết luận rằng khả năng lãnh đạo thực sự không nằm ở việc trở thành tâm điểm chú ý, mà ở việc tạo ra những thay đổi tích cực và bền vững.","audioRange":[77.563,83.686]}],"phrases":[{"phrase":"adequate resources","meaning":"nguồn lực đầy đủ","sentenceIndex":0},{"phrase":"guarantee success","meaning":"bảo đảm thành công","sentenceIndex":0},{"phrase":"fickle public opinion","meaning":"dư luận thất thường","sentenceIndex":1},{"phrase":"maintain long-term support","meaning":"duy trì sự ủng hộ lâu dài","sentenceIndex":1},{"phrase":"unexpected setbacks","meaning":"những trở ngại bất ngờ","sentenceIndex":2},{"phrase":"a remarkably versatile leader","meaning":"một nhà lãnh đạo đặc biệt đa năng","sentenceIndex":3},{"phrase":"adapting to changing circumstances","meaning":"thích nghi với hoàn cảnh thay đổi","sentenceIndex":3},{"phrase":"flamboyant publicity stunts","meaning":"những chiêu trò quảng bá phô trương","sentenceIndex":4},{"phrase":"let his actions speak for themselves","meaning":"để hành động tự chứng minh giá trị","sentenceIndex":4},{"phrase":"vicious personal attacks","meaning":"những lời công kích cá nhân ác ý","sentenceIndex":5},{"phrase":"genuine humility","meaning":"sự khiêm tốn chân thành","sentenceIndex":7},{"phrase":"making a lasting difference","meaning":"tạo ra sự thay đổi lâu dài","sentenceIndex":9}],"image":"heading-04.png","audio":"audio-04.mp3","paragraphEnds":[3,6,10]},{"id":5,"title":"An International School Festival","category":"Community & Culture","prompt":"How can students organise a festival that celebrates different cultures?","english":"Our school decided to organise an international festival to introduce students to different cultures. Although we had adequate time to prepare, unexpected problems soon appeared. The student responsible for decorations was rather fickle and kept changing the original design. Fortunately, Anna was a versatile member of the organising team who could handle different tasks, from preparing traditional food to arranging performances. Some students wore flamboyant costumes to attract the audience's attention, while others preferred simpler outfits. Despite the pressure, everyone worked together and showed considerable humility when receiving feedback. By the end of the day, the festival had become a great success, proving that cooperation and creativity could make a difference.","vietnamese":"Trường chúng tôi quyết định tổ chức một lễ hội quốc tế nhằm giới thiệu cho học sinh những nền văn hóa khác nhau. Mặc dù chúng tôi có đủ thời gian chuẩn bị, những vấn đề bất ngờ vẫn sớm xuất hiện. Học sinh phụ trách trang trí khá thất thường và liên tục thay đổi thiết kế ban đầu. May mắn thay, Anna là một thành viên đa năng trong ban tổ chức, người có thể đảm nhận nhiều nhiệm vụ khác nhau, từ chuẩn bị món ăn truyền thống đến sắp xếp các tiết mục biểu diễn. Một số học sinh mặc những bộ trang phục sặc sỡ để thu hút sự chú ý của khán giả, trong khi những người khác thích trang phục đơn giản hơn. Bất chấp áp lực, mọi người vẫn phối hợp với nhau và thể hiện sự khiêm tốn đáng kể khi tiếp nhận góp ý. Cuối ngày, lễ hội đã trở thành một thành công lớn, chứng minh rằng sự hợp tác và sáng tạo có thể tạo nên sự khác biệt.","sentences":[{"en":"Our school decided to organise an international festival to introduce students to different cultures.","vi":"Trường chúng tôi quyết định tổ chức một lễ hội quốc tế nhằm giới thiệu cho học sinh những nền văn hóa khác nhau.","audioRange":[3.139,8.544]},{"en":"Although we had adequate time to prepare, unexpected problems soon appeared.","vi":"Mặc dù chúng tôi có đủ thời gian chuẩn bị, những vấn đề bất ngờ vẫn sớm xuất hiện.","audioRange":[9.016,13.625]},{"en":"The student responsible for decorations was rather fickle and kept changing the original design.","vi":"Học sinh phụ trách trang trí khá thất thường và liên tục thay đổi thiết kế ban đầu.","audioRange":[14.247,19.267]},{"en":"Fortunately, Anna was a versatile member of the organising team who could handle different tasks, from preparing traditional food to arranging performances.","vi":"May mắn thay, Anna là một thành viên đa năng trong ban tổ chức, người có thể đảm nhận nhiều nhiệm vụ khác nhau, từ chuẩn bị món ăn truyền thống đến sắp xếp các tiết mục biểu diễn.","audioRange":[19.854,28.151]},{"en":"Some students wore flamboyant costumes to attract the audience's attention, while others preferred simpler outfits.","vi":"Một số học sinh mặc những bộ trang phục sặc sỡ để thu hút sự chú ý của khán giả, trong khi những người khác thích trang phục đơn giản hơn.","audioRange":[28.782,34.911]},{"en":"Despite the pressure, everyone worked together and showed considerable humility when receiving feedback.","vi":"Bất chấp áp lực, mọi người vẫn phối hợp với nhau và thể hiện sự khiêm tốn đáng kể khi tiếp nhận góp ý.","audioRange":[35.573,40.859]},{"en":"By the end of the day, the festival had become a great success, proving that cooperation and creativity could make a difference.","vi":"Cuối ngày, lễ hội đã trở thành một thành công lớn, chứng minh rằng sự hợp tác và sáng tạo có thể tạo nên sự khác biệt.","audioRange":[41.536,48.304]}],"phrases":[{"phrase":"organise an international festival","meaning":"tổ chức một lễ hội quốc tế","sentenceIndex":0},{"phrase":"adequate time to prepare","meaning":"đủ thời gian chuẩn bị","sentenceIndex":1},{"phrase":"rather fickle","meaning":"khá thất thường","sentenceIndex":2},{"phrase":"kept changing the original design","meaning":"liên tục thay đổi thiết kế ban đầu","sentenceIndex":2},{"phrase":"a versatile member of the organising team","meaning":"một thành viên đa năng trong ban tổ chức","sentenceIndex":3},{"phrase":"flamboyant costumes","meaning":"những bộ trang phục sặc sỡ","sentenceIndex":4},{"phrase":"attract the audience's attention","meaning":"thu hút sự chú ý của khán giả","sentenceIndex":4},{"phrase":"worked together","meaning":"phối hợp với nhau","sentenceIndex":5},{"phrase":"showed considerable humility","meaning":"thể hiện sự khiêm tốn đáng kể","sentenceIndex":5},{"phrase":"make a difference","meaning":"tạo nên sự khác biệt","sentenceIndex":6}],"image":"heading-05.png","audio":"audio-05.mp3","paragraphEnds":[3,5,7]},{"id":6,"title":"Learning to Accept Defeat","category":"Challenges & Personal Growth","prompt":"What can people learn from losing a competition or facing criticism?","english":"Taking part in a regional debate competition was a challenging experience for me. I had to face an experienced opponent who seemed to know almost everything about the topic. At first, I felt nervous and found it difficult to remain calm and confident. However, my teacher advised me to focus on the main arguments rather than worry about winning. During the final round, my opponent made several vicious comments about my ideas, but I decided not to respond emotionally. I strongly loathe personal attacks because they prevent people from having meaningful discussions. Although I did not win, I accepted the result with humility and realised that losing can sometimes teach us more than winning.","vietnamese":"Tham gia một cuộc thi tranh biện cấp khu vực là một trải nghiệm đầy thử thách đối với tôi. Tôi phải đối mặt với một đối thủ giàu kinh nghiệm, người dường như biết gần như mọi thứ về chủ đề này. Ban đầu, tôi cảm thấy lo lắng và khó giữ được bình tĩnh và sự tự tin. Tuy nhiên, giáo viên khuyên tôi nên tập trung vào những luận điểm chính thay vì lo lắng về việc chiến thắng. Trong vòng chung kết, đối thủ đưa ra một số nhận xét cay nghiệt về những ý tưởng của tôi, nhưng tôi quyết định không phản ứng theo cảm xúc. Tôi rất ghét những lời công kích cá nhân bởi chúng ngăn cản mọi người có được những cuộc thảo luận có ý nghĩa. Mặc dù không giành chiến thắng, tôi vẫn khiêm tốn chấp nhận kết quả và nhận ra rằng đôi khi thất bại có thể dạy chúng ta nhiều điều hơn cả chiến thắng.","sentences":[{"en":"Taking part in a regional debate competition was a challenging experience for me.","vi":"Tham gia một cuộc thi tranh biện cấp khu vực là một trải nghiệm đầy thử thách đối với tôi.","audioRange":[3.318,7.789]},{"en":"I had to face an experienced opponent who seemed to know almost everything about the topic.","vi":"Tôi phải đối mặt với một đối thủ giàu kinh nghiệm, người dường như biết gần như mọi thứ về chủ đề này.","audioRange":[8.269,13.184]},{"en":"At first, I felt nervous and found it difficult to remain calm and confident.","vi":"Ban đầu, tôi cảm thấy lo lắng và khó giữ được bình tĩnh và sự tự tin.","audioRange":[13.761,18.384]},{"en":"However, my teacher advised me to focus on the main arguments rather than worry about winning.","vi":"Tuy nhiên, giáo viên khuyên tôi nên tập trung vào những luận điểm chính thay vì lo lắng về việc chiến thắng.","audioRange":[18.913,24.557]},{"en":"During the final round, my opponent made several vicious comments about my ideas, but I decided not to respond emotionally.","vi":"Trong vòng chung kết, đối thủ đưa ra một số nhận xét cay nghiệt về những ý tưởng của tôi, nhưng tôi quyết định không phản ứng theo cảm xúc.","audioRange":[25.351,32.773]},{"en":"I strongly loathe personal attacks because they prevent people from having meaningful discussions.","vi":"Tôi rất ghét những lời công kích cá nhân bởi chúng ngăn cản mọi người có được những cuộc thảo luận có ý nghĩa.","audioRange":[33.158,38.925]},{"en":"Although I did not win, I accepted the result with humility and realised that losing can sometimes teach us more than winning.","vi":"Mặc dù không giành chiến thắng, tôi vẫn khiêm tốn chấp nhận kết quả và nhận ra rằng đôi khi thất bại có thể dạy chúng ta nhiều điều hơn cả chiến thắng.","audioRange":[39.622,47.095]}],"phrases":[{"phrase":"Taking part in a regional debate competition","meaning":"tham gia một cuộc thi tranh biện cấp khu vực","sentenceIndex":0},{"phrase":"an experienced opponent","meaning":"một đối thủ giàu kinh nghiệm","sentenceIndex":1},{"phrase":"remain calm and confident","meaning":"giữ bình tĩnh và tự tin","sentenceIndex":2},{"phrase":"focus on the main arguments","meaning":"tập trung vào những luận điểm chính","sentenceIndex":3},{"phrase":"vicious comments","meaning":"những nhận xét cay nghiệt","sentenceIndex":4},{"phrase":"respond emotionally","meaning":"phản ứng theo cảm xúc","sentenceIndex":4},{"phrase":"loathe personal attacks","meaning":"rất ghét những lời công kích cá nhân","sentenceIndex":5},{"phrase":"meaningful discussions","meaning":"những cuộc thảo luận có ý nghĩa","sentenceIndex":5},{"phrase":"accepted the result with humility","meaning":"khiêm tốn chấp nhận kết quả","sentenceIndex":6}],"image":"heading-06.png","audio":"audio-06.mp3","paragraphEnds":[4,7]},{"id":7,"title":"A Second Chance for Abandoned Animals","category":"Community & Compassion","prompt":"Why is patience important when caring for abandoned animals?","english":"Last summer, I volunteered at a local animal shelter where abandoned pets were given a second chance. One afternoon, a frightened dog with a history of aggressive behaviour was brought in. Everyone was warned that it could become vicious if approached carelessly. Although I used to loathe being around aggressive animals, I decided to help because I wanted to overcome my fear. The shelter manager taught me how to remain calm and approach the dog patiently. Working there also required me to be versatile, as I had to feed the animals, clean their living areas and assist visitors. After several weeks of careful training, the dog became much friendlier. Seeing its remarkable transformation made me feel that every effort had been worthwhile.","vietnamese":"Mùa hè năm ngoái, tôi làm tình nguyện tại một trung tâm cứu hộ động vật địa phương, nơi những thú cưng bị bỏ rơi được trao cơ hội thứ hai. Một buổi chiều, một chú chó sợ hãi có tiền sử hành vi hung dữ được đưa đến. Mọi người được cảnh báo rằng nó có thể trở nên nguy hiểm nếu bị tiếp cận một cách bất cẩn. Mặc dù trước đây tôi rất ghét việc ở gần những con vật hung dữ, tôi vẫn quyết định giúp đỡ vì muốn vượt qua nỗi sợ của mình. Người quản lý trung tâm dạy tôi cách giữ bình tĩnh và kiên nhẫn tiếp cận chú chó. Công việc ở đó cũng đòi hỏi tôi phải linh hoạt, đa năng, vì tôi phải cho động vật ăn, dọn dẹp khu vực sinh sống và hỗ trợ khách đến thăm. Sau vài tuần được huấn luyện cẩn thận, chú chó trở nên thân thiện hơn rất nhiều. Chứng kiến sự thay đổi đáng kinh ngạc của nó khiến tôi cảm thấy rằng mọi nỗ lực đều xứng đáng.","sentences":[{"en":"Last summer, I volunteered at a local animal shelter where abandoned pets were given a second chance.","vi":"Mùa hè năm ngoái, tôi làm tình nguyện tại một trung tâm cứu hộ động vật địa phương, nơi những thú cưng bị bỏ rơi được trao cơ hội thứ hai.","audioRange":[3.429,9.049]},{"en":"One afternoon, a frightened dog with a history of aggressive behaviour was brought in.","vi":"Một buổi chiều, một chú chó sợ hãi có tiền sử hành vi hung dữ được đưa đến.","audioRange":[9.584,14.066]},{"en":"Everyone was warned that it could become vicious if approached carelessly.","vi":"Mọi người được cảnh báo rằng nó có thể trở nên nguy hiểm nếu bị tiếp cận một cách bất cẩn.","audioRange":[14.533,17.749]},{"en":"Although I used to loathe being around aggressive animals, I decided to help because I wanted to overcome my fear.","vi":"Mặc dù trước đây tôi rất ghét việc ở gần những con vật hung dữ, tôi vẫn quyết định giúp đỡ vì muốn vượt qua nỗi sợ của mình.","audioRange":[18.133,24.254]},{"en":"The shelter manager taught me how to remain calm and approach the dog patiently.","vi":"Người quản lý trung tâm dạy tôi cách giữ bình tĩnh và kiên nhẫn tiếp cận chú chó.","audioRange":[24.851,28.82]},{"en":"Working there also required me to be versatile, as I had to feed the animals, clean their living areas and assist visitors.","vi":"Công việc ở đó cũng đòi hỏi tôi phải linh hoạt, đa năng, vì tôi phải cho động vật ăn, dọn dẹp khu vực sinh sống và hỗ trợ khách đến thăm.","audioRange":[29.463,35.896]},{"en":"After several weeks of careful training, the dog became much friendlier.","vi":"Sau vài tuần được huấn luyện cẩn thận, chú chó trở nên thân thiện hơn rất nhiều.","audioRange":[36.464,40.116]},{"en":"Seeing its remarkable transformation made me feel that every effort had been worthwhile.","vi":"Chứng kiến sự thay đổi đáng kinh ngạc của nó khiến tôi cảm thấy rằng mọi nỗ lực đều xứng đáng.","audioRange":[40.578,45.282]}],"phrases":[{"phrase":"volunteered at a local animal shelter","meaning":"làm tình nguyện tại một trung tâm cứu hộ động vật địa phương","sentenceIndex":0},{"phrase":"abandoned pets","meaning":"những thú cưng bị bỏ rơi","sentenceIndex":0},{"phrase":"a history of aggressive behaviour","meaning":"tiền sử hành vi hung dữ","sentenceIndex":1},{"phrase":"become vicious","meaning":"trở nên hung dữ, nguy hiểm","sentenceIndex":2},{"phrase":"overcome my fear","meaning":"vượt qua nỗi sợ của bản thân","sentenceIndex":3},{"phrase":"remain calm","meaning":"giữ bình tĩnh","sentenceIndex":4},{"phrase":"approach the dog patiently","meaning":"kiên nhẫn tiếp cận chú chó","sentenceIndex":4},{"phrase":"feed the animals","meaning":"cho động vật ăn","sentenceIndex":5},{"phrase":"careful training","meaning":"quá trình huấn luyện cẩn thận","sentenceIndex":6},{"phrase":"remarkable transformation","meaning":"sự thay đổi đáng kinh ngạc","sentenceIndex":7},{"phrase":"every effort had been worthwhile","meaning":"mọi nỗ lực đều xứng đáng","sentenceIndex":7}],"image":"heading-07.png","audio":"audio-07.mp3","paragraphEnds":[3,6,8]},{"id":8,"title":"The Challenge of a City Night Run","category":"Challenges & Personal Growth","prompt":"How can taking part in a charity run build confidence and perseverance?","english":"A few months ago, I registered for a city night run to raise money for disadvantaged children. The event seemed easy at first, but the weather was extremely unpredictable. After a long, torrid afternoon, the temperature remained high even after sunset. Some participants began to lose confidence, while others struggled to keep up with their opponents. I reminded myself to remain calm and focus on my own performance rather than compare my speed with others. Along the route, volunteers provided water and encouraged runners to continue. Although I was exhausted when I crossed the finish line, I felt incredibly proud. Later, I enjoyed a serene evening with my friends, knowing that our hard work had finally paid off and that we had contributed to a meaningful cause.","vietnamese":"Vài tháng trước, tôi đăng ký tham gia một cuộc chạy bộ ban đêm trong thành phố nhằm gây quỹ cho trẻ em có hoàn cảnh khó khăn. Ban đầu, sự kiện có vẻ khá dễ dàng, nhưng thời tiết lại vô cùng khó dự đoán. Sau một buổi chiều dài nóng như thiêu đốt, nhiệt độ vẫn ở mức cao ngay cả khi mặt trời đã lặn. Một số người tham gia bắt đầu mất tự tin, trong khi những người khác chật vật để theo kịp các đối thủ. Tôi tự nhắc mình phải giữ bình tĩnh và tập trung vào thành tích của bản thân thay vì so sánh tốc độ với người khác. Dọc đường chạy, các tình nguyện viên cung cấp nước và động viên những người chạy tiếp tục. Mặc dù kiệt sức khi cán đích, tôi cảm thấy vô cùng tự hào. Sau đó, tôi tận hưởng một buổi tối yên bình bên bạn bè, biết rằng những nỗ lực của chúng tôi cuối cùng đã được đền đáp và chúng tôi đã đóng góp cho một mục đích đầy ý nghĩa.","sentences":[{"en":"A few months ago, I registered for a city night run to raise money for disadvantaged children.","vi":"Vài tháng trước, tôi đăng ký tham gia một cuộc chạy bộ ban đêm trong thành phố nhằm gây quỹ cho trẻ em có hoàn cảnh khó khăn.","audioRange":[3.3,8.0]},{"en":"The event seemed easy at first, but the weather was extremely unpredictable.","vi":"Ban đầu, sự kiện có vẻ khá dễ dàng, nhưng thời tiết lại vô cùng khó dự đoán.","audioRange":[8.54,13.557]},{"en":"After a long, torrid afternoon, the temperature remained high even after sunset.","vi":"Sau một buổi chiều dài nóng như thiêu đốt, nhiệt độ vẫn ở mức cao ngay cả khi mặt trời đã lặn.","audioRange":[14.052,19.502]},{"en":"Some participants began to lose confidence, while others struggled to keep up with their opponents.","vi":"Một số người tham gia bắt đầu mất tự tin, trong khi những người khác chật vật để theo kịp các đối thủ.","audioRange":[19.89,25.027]},{"en":"I reminded myself to remain calm and focus on my own performance rather than compare my speed with others.","vi":"Tôi tự nhắc mình phải giữ bình tĩnh và tập trung vào thành tích của bản thân thay vì so sánh tốc độ với người khác.","audioRange":[25.313,31.603]},{"en":"Along the route, volunteers provided water and encouraged runners to continue.","vi":"Dọc đường chạy, các tình nguyện viên cung cấp nước và động viên những người chạy tiếp tục.","audioRange":[32.342,36.682]},{"en":"Although I was exhausted when I crossed the finish line, I felt incredibly proud.","vi":"Mặc dù kiệt sức khi cán đích, tôi cảm thấy vô cùng tự hào.","audioRange":[37.356,42.376]},{"en":"Later, I enjoyed a serene evening with my friends, knowing that our hard work had finally paid off and that we had contributed to a meaningful cause.","vi":"Sau đó, tôi tận hưởng một buổi tối yên bình bên bạn bè, biết rằng những nỗ lực của chúng tôi cuối cùng đã được đền đáp và chúng tôi đã đóng góp cho một mục đích đầy ý nghĩa.","audioRange":[42.809,51.752]}],"phrases":[{"phrase":"registered for a city night run","meaning":"đăng ký tham gia một cuộc chạy bộ ban đêm trong thành phố","sentenceIndex":0},{"phrase":"raise money for disadvantaged children","meaning":"gây quỹ cho trẻ em có hoàn cảnh khó khăn","sentenceIndex":0},{"phrase":"extremely unpredictable","meaning":"cực kỳ khó dự đoán","sentenceIndex":1},{"phrase":"torrid afternoon","meaning":"một buổi chiều nóng như thiêu đốt","sentenceIndex":2},{"phrase":"lose confidence","meaning":"mất tự tin","sentenceIndex":3},{"phrase":"keep up with their opponents","meaning":"theo kịp các đối thủ","sentenceIndex":3},{"phrase":"focus on my own performance","meaning":"tập trung vào thành tích của bản thân","sentenceIndex":4},{"phrase":"crossed the finish line","meaning":"về đích","sentenceIndex":6},{"phrase":"a serene evening","meaning":"một buổi tối yên bình","sentenceIndex":7},{"phrase":"hard work had finally paid off","meaning":"những nỗ lực cuối cùng đã được đền đáp","sentenceIndex":7},{"phrase":"contributed to a meaningful cause","meaning":"đóng góp cho một mục đích đầy ý nghĩa","sentenceIndex":7}],"image":"heading-08.png","audio":"audio-08.mp3","paragraphEnds":[3,6,8]}]</script>
<script>
(()=>{
'use strict';
const STORIES=JSON.parse(document.getElementById('reading-data').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let storyIndex=0,tab='home',phraseIndex=0,drillIndex=0,sentenceIndex=0,cardIndex=0,showTranslation=false,highlights=true,showAnswer=false,modalPhrase=null,returnFocus=null;
let audio=null, homePlayer=null, trackText=false;
const state={};
function st(){const id=STORIES[storyIndex].id;if(!state[id])state[id]={known:[],study:[],sentences:[],used:[],notes:''};return state[id]}
function save(){try{localStorage.setItem('abhi-reading8-state',JSON.stringify(state))}catch(e){}}
try{Object.assign(state,JSON.parse(localStorage.getItem('abhi-reading8-state')||'{}'))}catch(e){}
function story(){return STORIES[storyIndex]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(t){if(!Number.isFinite(t))return '0:00';let m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function releaseAudio(){
 if(!audio)return;
 const previous=audio;
 audio=null;
 previous.pause();
 previous.removeAttribute('src');
 previous.load();
}
function listenToSentence(index,button){
 const s=story(),[start,end]=s.sentences[index].audioRange;
 if(audio && !audio.paused && button.getAttribute('aria-pressed')==='true'){
   audio.pause();
   return;
 }
 if(audio===homePlayer && homePlayer){
   homePlayer.pause();
 }else{
   releaseAudio();
 }
 const player=new Audio(s.audio+'#t='+start+','+end);
 audio=player;
 const label=button.dataset.label || button.textContent;
 button.dataset.label=label;
 const reset=()=>{
   button.textContent=label;
   button.setAttribute('aria-pressed','false');
 };
 player.addEventListener('pause',reset,{once:true});
 player.addEventListener('ended',reset,{once:true});
 function checkClipEnd(){
   if(player.paused)return;
   if(player.currentTime>=end){
     player.pause();
     return;
   }
   requestAnimationFrame(checkClipEnd);
 }
 player.addEventListener('playing',()=>requestAnimationFrame(checkClipEnd),{once:true});
 player.addEventListener('timeupdate',()=>{
   if(player.currentTime>=end)player.pause();
 });
 button.textContent='Ⅱ Pause';
 button.setAttribute('aria-pressed','true');
 player.play().catch(()=>{
   if(audio===player){
     reset();
     button.textContent='Audio unavailable · Retry';
   }
 });
}
function passageParagraphs(s,language){
 let first=0;
 return s.paragraphEnds.map(last=>{
   const group=s.sentences.slice(first,last);
   const text=group.map((q,i)=>{
     const line=q[language];
     return language==='en'
       ? '<span class="reading-sentence" data-sentence="'+(first+i)+'">'+markedText(line)+'</span>'
       : esc(line);
   }).join(' ');
   first=last;
   return '<p>'+text+'</p>';
 }).join('');
}
function renderSidebar(){const make=(items)=>items.map((s,i)=>`<button class="story-button ${s.id===story().id?'active':''}" data-story="${s.id}"><span class="story-num">${String(s.id).padStart(2,'0')}</span><span><span class="story-name">${esc(s.title)}</span><span class="story-count">${s.sentences.length} sentences · ${s.phrases.length} phrases</span></span></button>`).join('');$('#storyListA').innerHTML=make(STORIES.slice(0,4));$('#storyListB').innerHTML=make(STORIES.slice(4));$$('[data-story]').forEach(b=>b.addEventListener('click',()=>changeStory(Number(b.dataset.story)-1)))}
function changeStory(i){if(i<0||i>=STORIES.length)return;storyIndex=i;phraseIndex=0;drillIndex=0;sentenceIndex=0;cardIndex=0;showTranslation=false;showAnswer=false;renderSidebar();render()}
function navStory(delta){changeStory(storyIndex+delta)}
function tabs(){ $$('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')}) }
function setTab(t){tab=t;render()}
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function phraseSentence(p){return story().sentences[p.sentenceIndex]}
function markedText(text){let phrases=[...story().phrases].sort((a,b)=>b.phrase.length-a.phrase.length);let out='',pos=0;while(pos<text.length){let found=null;for(const p of phrases){if(text.slice(pos,pos+p.phrase.length).replaceAll('\u00a0',' ').toLowerCase()===p.phrase.toLowerCase()){found=p;break}}if(found){const color=story().phrases.indexOf(found)%2?'gold':'mint';out+=`<span class="phrase ${color}" role="button" tabindex="0" data-phrase="${story().phrases.indexOf(found)}" title="Open vocabulary">${esc(text.slice(pos,pos+found.phrase.length))}</span>`;pos+=found.phrase.length}else{out+=esc(text[pos]);pos++}}return out}
function renderHome(){const s=story();return `<div class="eyebrow">READING 8 · COLLECTION ${s.id<=4?'01':'02'}</div>
 <figure class="heading-figure"><img class="heading-image" src="${s.image}" alt="${esc(s.title)} heading image"></figure>
 <div class="audio-panel"><button class="play-btn" id="playBtn" aria-label="Play or pause passage">▶ Play</button><button class="stop-btn" id="stopBtn" aria-label="Stop audio">■</button><input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="Audio position"><span class="time" id="time">0:00 / 0:00</span><select class="speed" id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></div>
 <div class="audio-note" lang="vi">Nghe toàn bài ở đây. Mở mục Sentence để nghe từng câu.</div>
 <div class="controls"><button class="pill ${trackText?'on':''}" id="trackToggle" aria-pressed="${trackText}">▶ Chạy chữ · ${trackText?'ON':'OFF'}</button><button class="pill ${highlights?'on':''}" id="highlightToggle">✓ Highlights ${highlights?'ON':'OFF'}</button><button class="pill ${showTranslation?'on':''}" id="viToggle">VI · ${showTranslation?'ON':'OFF'}</button></div>
 <div class="passage-area"><div class="passage-text ${highlights?'':'no-highlights'}" id="passageText" lang="en">${passageParagraphs(s,'en')}</div><div class="translation-box" id="translationBox" lang="vi" ${showTranslation?'':'hidden'}><h3>BẢN DỊCH TIẾNG VIỆT</h3>${passageParagraphs(s,'vi')}</div></div>
 <div class="phrase-bank"><h2 class="section-heading">Useful phrases · ${s.phrases.length} expressions</h2><div class="phrase-chips">${s.phrases.map((p,i)=>`<button class="phrase-chip" data-phrase="${i}">${esc(p.phrase)}</button>`).join('')}</div></div>
 ${storyNav()}`}
function storyNav(){return `<div class="story-nav"><button class="nav-btn" id="prevStory" ${storyIndex===0?'disabled':''}>← Previous story</button><span class="story-progress">${storyIndex+1} / ${STORIES.length}</span><button class="nav-btn" id="nextStory" ${storyIndex===STORIES.length-1?'disabled':''}>Next story →</button></div>`}
function renderSentence(){const s=story(),q=s.sentences[sentenceIndex],done=st().sentences.includes(sentenceIndex);return `<div class="practice-card"><div class="practice-kicker">SENTENCE PRACTICE · ${String(s.id).padStart(2,'0')}</div><h2 class="practice-title">Say it in English</h2><div class="progress-row"><span>Sentence ${sentenceIndex+1} of ${s.sentences.length}</span><span id="sentenceDoneCount">${st().sentences.length} completed</span></div><div class="progress-track"><div class="progress-fill" id="sentenceProgressFill" style="width:${st().sentences.length/s.sentences.length*100}%"></div></div><div class="prompt-box">${esc(q.vi)}</div><button class="action outline" id="listenSentence" aria-pressed="false">▶ Listen to sentence</button><div class="small-muted">Use the Vietnamese prompt to recall the original English sentence.</div><div class="practice-actions"><button class="action secondary" id="showSentence">Show answer</button></div><div class="answer" id="sentenceAnswer" ${showAnswer?'':'hidden'}>${esc(q.en)}</div><label for="typedAnswer" class="section-heading" style="display:block;margin-top:20px">Type your answer (optional)</label><input id="typedAnswer" class="input-line" autocomplete="off" placeholder="Write the English sentence here…"><div class="practice-actions"><button class="action" id="checkTyped">Check typed answer</button><button class="action outline" id="saidIt">I said it ✓</button></div><div class="feedback" id="sentenceFeedback">${done?'✓ This sentence is already counted in your progress.':''}</div><div class="practice-actions"><button class="action outline" id="prevSentence" ${sentenceIndex===0?'disabled':''}>← Previous</button><button class="action outline" id="nextSentence" ${sentenceIndex===s.sentences.length-1?'disabled':''}>Next →</button></div>${storyNav()}</div>`}
function normalizeAnswer(s){return s.toLowerCase().replace(/[^\p{L}\p{N}\s']/gu,'').replace(/\s+/g,' ').trim()}
function renderSpeak(){const s=story();return `<div class="practice-card"><div class="practice-kicker">SPEAKING TASK · ${String(s.id).padStart(2,'0')}</div><h2 class="practice-title">Speak about the topic</h2><div class="prompt-box">${esc(s.prompt)}<div class="small-muted">Target: use at least 5 useful phrases in 45–60 seconds.</div></div><div class="progress-row"><span>Phrase bank</span><span id="usedCount">${st().used.length} / ${s.phrases.length} used</span></div><div class="phrase-checks">${s.phrases.map((p,i)=>`<label class="phrase-check"><input type="checkbox" data-used="${i}" ${st().used.includes(i)?'checked':''}><span><b>${esc(p.phrase)}</b><br><span style="color:#887b69">${esc(p.meaning)}</span></span></label>`).join('')}</div><label for="speakNotes" class="section-heading" style="display:block;margin-top:22px">My speaking notes</label><textarea id="speakNotes" class="notes" placeholder="Write a few key ideas before speaking…">${esc(st().notes)}</textarea><div class="practice-actions"><button class="action" id="copyNotes">Copy my notes</button><button class="action outline" id="clearNotes">Clear notes</button><button class="action secondary" id="resetPhrases">Reset phrase bank</button></div>${storyNav()}</div>`}
function renderDrilling(){const s=story(),p=s.phrases[drillIndex],sentence=phraseSentence(p);let blank=sentence.en;const at=blank.toLowerCase().indexOf(p.phrase.toLowerCase());if(at>=0)blank=blank.slice(0,at)+'____________'+blank.slice(at+p.phrase.length);return `<div class="practice-card"><div class="practice-kicker">COLLOCATION DRILL · ${String(s.id).padStart(2,'0')}</div><h2 class="practice-title">Complete the sentence</h2><div class="progress-row"><span>Item ${drillIndex+1} of ${s.phrases.length}</span><span>${s.phrases.length} items</span></div><div class="progress-track"><div class="progress-fill" style="width:${(drillIndex+1)/s.phrases.length*100}%"></div></div><div class="prompt-box">${esc(blank)}</div><div class="small-muted">Meaning: ${esc(p.meaning)}</div><label class="section-heading" for="drillInput" style="display:block;margin-top:20px">Missing phrase</label><input class="input-line" id="drillInput" placeholder="Type the missing phrase…" autocomplete="off"><div class="practice-actions"><button class="action" id="checkDrill">Check</button><button class="action secondary" id="showDrill">Show answer</button></div><div class="feedback" id="drillFeedback"></div><div class="answer" id="drillAnswer" hidden><b>${esc(p.phrase)}</b><br>${esc(sentence.vi)}</div><div class="practice-actions"><button class="action outline" id="prevDrill" ${drillIndex===0?'disabled':''}>← Previous</button><button class="action outline" id="nextDrill" ${drillIndex===s.phrases.length-1?'disabled':''}>Next →</button></div>${storyNav()}</div>`}
function renderCards(){const s=story(),p=s.phrases[cardIndex],q=phraseSentence(p),known=st().known.includes(cardIndex),study=st().study.includes(cardIndex);return `<div class="practice-card"><div class="practice-kicker">REVIEW CARDS · ${String(s.id).padStart(2,'0')}</div><h2 class="practice-title">Remember the phrase</h2><div class="progress-row"><span>Card ${cardIndex+1} of ${s.phrases.length}</span><span>${st().known.length} remembered</span></div><div class="card-face"><div class="card-phrase">${esc(p.phrase)}</div><div class="status-tag ${known?'remembered':''}">${known?'Remembered':study?'To study':'New card'}</div><div class="card-meaning" id="cardMeaning" hidden>${esc(p.meaning)}</div></div><div class="practice-actions" style="justify-content:center"><button class="action secondary" id="showMeaning">Show meaning</button><button class="action outline" id="shuffleCards">Shuffle</button></div><div class="answer" id="cardDetails" hidden><b>Source sentence</b><p>${esc(q.en)}</p><b>Vietnamese translation</b><p>${esc(q.vi)}</p></div><div class="practice-actions" style="justify-content:center"><button class="action outline" id="listenCard" aria-pressed="false">▶ Listen to source sentence</button><button class="action" id="knowCard">I know this ✓</button><button class="action secondary" id="studyCard">Study</button></div><div class="practice-actions" style="justify-content:space-between"><button class="action outline" id="prevCard" ${cardIndex===0?'disabled':''}>← Previous</button><button class="action outline" id="nextCard" ${cardIndex===s.phrases.length-1?'disabled':''}>Next →</button></div>${storyNav()}</div>`}
function render(){releaseAudio();if(homePlayer){audio=homePlayer;releaseAudio();homePlayer=null;}tabs();const v=$('#view');v.innerHTML=tab==='home'?renderHome():tab==='sentence'?renderSentence():tab==='speak'?renderSpeak():tab==='drilling'?renderDrilling():renderCards();bindCommon();if(tab==='home')bindHome();if(tab==='sentence')bindSentence();if(tab==='speak')bindSpeak();if(tab==='drilling')bindDrilling();if(tab==='cards')bindCards()}
function bindCommon(){const p=$('#prevStory'),n=$('#nextStory');if(p)p.onclick=()=>navStory(-1);if(n)n.onclick=()=>navStory(1)}
function bindHome(){
 const s=story(), player=new Audio(s.audio);
 homePlayer=audio=player;
 player.preload='metadata';
 const play=$('#playBtn'),stop=$('#stopBtn'),seek=$('#seek'),time=$('#time'),speed=$('#speed');
 const sentences=$$('.reading-sentence'), track=$('#trackToggle');
 let active=-1;
 function update(){
   if(Number.isFinite(player.duration)){
     seek.value=player.currentTime/player.duration*100;
     time.textContent=fmt(player.currentTime)+' / '+fmt(player.duration);
   }
   const next=trackText && !player.ended
     ? s.sentences.findIndex(q=>q.audioRange[0]<=player.currentTime && player.currentTime<q.audioRange[1])
     : -1;
   if(active!==next){
     sentences[active]?.classList.remove('is-playing');
     sentences[next]?.classList.add('is-playing');
     active=next;
   }
 }
 player.addEventListener('loadedmetadata',update);
 player.addEventListener('timeupdate',update);
 player.addEventListener('play',()=>{play.textContent='Ⅱ Pause';update()});
 player.addEventListener('pause',()=>{play.textContent='▶ Play'});
 player.addEventListener('ended',update);
 player.addEventListener('error',()=>{time.textContent='Audio unavailable';play.disabled=true});
 play.onclick=()=>{
   if(!player.paused){player.pause();return;}
   player.play().catch(()=>{if(audio===player && play.isConnected)time.textContent='Cannot play audio'});
 };
 stop.onclick=()=>{player.pause();player.currentTime=0;update()};
 seek.oninput=()=>{if(Number.isFinite(player.duration))player.currentTime=Number(seek.value)/100*player.duration};
 speed.onchange=()=>{player.playbackRate=Number(speed.value)};
 track.onclick=()=>{
   trackText=!trackText;
   track.classList.toggle('on',trackText);
   track.setAttribute('aria-pressed',String(trackText));
   track.textContent='▶ Chạy chữ · '+(trackText?'ON':'OFF');
   update();
 };
 $('#highlightToggle').onclick=event=>{
   highlights=!highlights;
   $('#passageText').classList.toggle('no-highlights',!highlights);
   event.currentTarget.classList.toggle('on',highlights);
   event.currentTarget.textContent='✓ Highlights '+(highlights?'ON':'OFF');
 };
 $('#viToggle').onclick=event=>{
   showTranslation=!showTranslation;
   $('#translationBox').hidden=!showTranslation;
   event.currentTarget.classList.toggle('on',showTranslation);
   event.currentTarget.textContent='VI · '+(showTranslation?'ON':'OFF');
 };
 $$('[data-phrase]').forEach(el=>{
   el.addEventListener('click',()=>openPhrase(Number(el.dataset.phrase),el));
   if(el.tagName!=='BUTTON'){
     el.addEventListener('keydown',e=>{
       if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}
     });
   }
 });
}
function openPhrase(i,el){const p=story().phrases[i],q=phraseSentence(p);modalPhrase=i;returnFocus=el;const known=st().known.includes(i),study=st().study.includes(i);$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><button class="music-icon" type="button" id="listenPhrase" aria-pressed="false" title="Listen to source sentence">▶ Listen</button><button class="close" id="closeModal" aria-label="Close">×</button></div><h2 id="modalTitle">${esc(p.phrase)}</h2><div class="modal-meaning">${esc(p.meaning)}</div><hr class="modal-rule"><div class="modal-sentence">${esc(q.en)}</div><div class="modal-translation">${esc(q.vi)}</div><div class="modal-actions"><button class="know" id="modalKnow">${known?'Remembered ✓':'I know this'}</button><button class="study" id="modalStudy">${study?'In study list ✓':'Study'}</button></div></section></div>`;const listen=$('#listenPhrase');
 listen.onclick=()=>listenToSentence(p.sentenceIndex,listen);
 $('#closeModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#modalKnow').onclick=()=>{toggleStatus('known',i);$('#modalKnow').textContent=st().known.includes(i)?'Remembered ✓':'I know this'};$('#modalStudy').onclick=()=>{toggleStatus('study',i);$('#modalStudy').textContent=st().study.includes(i)?'In study list ✓':'Study'};$('#closeModal').focus()}
function closeModal(){
 if(audio && audio!==homePlayer)releaseAudio();
 audio=homePlayer;
 $('#modalRoot').innerHTML='';if(returnFocus&&document.contains(returnFocus))returnFocus.focus();returnFocus=null;modalPhrase=null }
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal()});
function toggleStatus(k,i){let a=st()[k];if(a.includes(i))st()[k]=a.filter(x=>x!==i);else st()[k]=[...a,i];save();renderSidebar()}
function bindSentence(){
 const listen=$('#listenSentence');
 listen.onclick=()=>listenToSentence(sentenceIndex,listen);
 const s=story(),q=s.sentences[sentenceIndex],answer=$('#sentenceAnswer');$('#showSentence').onclick=()=>{showAnswer=!showAnswer;answer.hidden=!showAnswer;$('#showSentence').textContent=showAnswer?'Hide answer':'Show answer'};$('#checkTyped').onclick=()=>{const v=normalizeAnswer($('#typedAnswer').value),target=normalizeAnswer(q.en),fb=$('#sentenceFeedback');if(v===target){fb.textContent='Correct — your sentence matches the source.';fb.className='feedback good';markSentence()}else{fb.textContent='Not quite. Compare your wording with the source answer.';fb.className='feedback bad'}};$('#saidIt').onclick=()=>{markSentence();const fb=$('#sentenceFeedback');fb.textContent='Marked as practised.';fb.className='feedback good'};$('#prevSentence').onclick=()=>{sentenceIndex--;showAnswer=false;render()};$('#nextSentence').onclick=()=>{sentenceIndex++;showAnswer=false;render()}}
function markSentence(){if(!st().sentences.includes(sentenceIndex)){st().sentences.push(sentenceIndex);save();renderSidebar()}const count=$('#sentenceDoneCount'),fill=$('#sentenceProgressFill');if(count)count.textContent=st().sentences.length+' completed';if(fill)fill.style.width=(st().sentences.length/story().sentences.length*100)+'%'}
function bindSpeak(){const notes=$('#speakNotes');notes.oninput=()=>{st().notes=notes.value;save()};$$('[data-used]').forEach(c=>c.onchange=()=>{let i=Number(c.dataset.used),a=st().used;if(c.checked&&!a.includes(i))a.push(i);if(!c.checked)st().used=a.filter(x=>x!==i);save();$('#usedCount').textContent=st().used.length+' / '+story().phrases.length+' used'});$('#copyNotes').onclick=async()=>{try{await navigator.clipboard.writeText(notes.value);$('#copyNotes').textContent='Copied ✓'}catch(e){notes.select();document.execCommand('copy');$('#copyNotes').textContent='Copied ✓'}};$('#clearNotes').onclick=()=>{notes.value='';st().notes='';save()};$('#resetPhrases').onclick=()=>{st().used=[];save();render()}}
function bindDrilling(){const p=story().phrases[drillIndex];$('#checkDrill').onclick=()=>{const ok=normalizeAnswer($('#drillInput').value)===normalizeAnswer(p.phrase),fb=$('#drillFeedback');fb.textContent=ok?'Correct!':'Try again. Check the phrase and its meaning.';fb.className='feedback '+(ok?'good':'bad')};$('#showDrill').onclick=()=>{$('#drillAnswer').hidden=false};$('#prevDrill').onclick=()=>{drillIndex--;render()};$('#nextDrill').onclick=()=>{drillIndex++;render()}}
function bindCards(){
 const p=story().phrases[cardIndex],listen=$('#listenCard');
 listen.onclick=()=>listenToSentence(p.sentenceIndex,listen);$('#showMeaning').onclick=()=>{$('#cardMeaning').hidden=false;$('#cardDetails').hidden=false};$('#knowCard').onclick=()=>{if(!st().known.includes(cardIndex))st().known.push(cardIndex);st().study=st().study.filter(x=>x!==cardIndex);save();render()};$('#studyCard').onclick=()=>{if(!st().study.includes(cardIndex))st().study.push(cardIndex);st().known=st().known.filter(x=>x!==cardIndex);save();render()};$('#prevCard').onclick=()=>{cardIndex--;render()};$('#nextCard').onclick=()=>{cardIndex++;render()};$('#shuffleCards').onclick=()=>{cardIndex=Math.floor(Math.random()*story().phrases.length);render()}}
renderSidebar();render();
})();
</script>
</body></html>
